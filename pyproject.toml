[project]
name = "saas-metrics"
version = "0.2.0"
description = "SaaS revenue metrics from a raw billing export, plus an SEC XBRL peer benchmark and a point-in-time FP&A forecast backtest — every definition written and tested."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sneh Patel" }]
keywords = ["saas", "mrr", "arr", "net revenue retention", "gross revenue retention", "churn", "cohort", "fp&a",
            "revenue waterfall", "sec", "xbrl", "rule of 40", "forecast backtest", "point-in-time"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "markdown>=3.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "formulas>=1.2"]
web = ["streamlit>=1.45", "plotly>=5.20", "fastmcp>=2.0"]
workbench = ["saas-metrics[web]"]  # backwards-compatible alias for the web extra
mcp = ["fastmcp>=2.0"]
pandera = ["pandera>=0.20"]
all = ["saas-metrics[dev,web,mcp,pandera]"]

[project.scripts]
saas-metrics = "saas_metrics.cli:main"
saasfpa = "saas_metrics.cli:main"

[project.urls]
Homepage = "https://github.com/Skippy-8/saas-metrics"
Issues = "https://github.com/Skippy-8/saas-metrics/issues"
Source = "https://github.com/Skippy-8/saas-metrics"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_metrics", "src/saasfpa"]

[tool.hatch.build.targets.wheel.force-include]
# company configs and the memo template ship inside the package, so a pip install works anywhere
"configs" = "saas_metrics/configs"
"memos/memo_template.md" = "saas_metrics/memo_template.md"

[tool.hatch.build.targets.sdist]
exclude = ["/data", "/private", "/out", "/dist", "*.duckdb", ".env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs SEC access (skipped in CI)"]
addopts = "-q -m 'not network'"
# the formulas package compiles with "is" comparisons against literals on import
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["saas_metrics", "saasfpa"]
